    <title>4. Nested Scrolling | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        Scrollable boxes inside a scrollable page.

        A box only scrolls if two things are true: it has a size in the scroll
        direction (a height to scroll vertically, a width to scroll horizontally),
        and an `overflow` of `auto` or `scroll`. Without them, it grows to fit its
        content, and the page scrolls instead.

        In Flutter, the same rule is strict: a scrollable inside a scrollable
        without a bounded size throws an "unbounded height" error. You give it a
        height, use `shrinkWrap: true`, or use slivers.
      */

      /* Vertical in vertical: a fixed height and overflow-y. */
      .same-direction {
        height: 280px;
        overflow-y: auto;
      }

      /* Horizontal in vertical: a row with overflow-x. */
      .opposite-direction {
        display: flex;
        gap: 12px;
        height: 120px;
        overflow-x: auto;
      }

      .opposite-direction > div {
        flex: 0 0 120px;
      }

      /* No height and no overflow: the box grows to fit its content. */
      .grows {
        height: auto;
      }
    </style>
  </head>

      <div class="block container padded stack same-direction" data-fill="20" data-label="Inner "></div>

      <h2>Horizontal in vertical (fixed height)</h2>
      <div class="opposite-direction" data-fill="12"></div>

      <h2>Grows with its content (the default)</h2>
      <div class="block container padded stack grows" data-fill="8" data-label="Item "></div>
