  <head>
    <meta charset="UTF-8" />

    <title>8. Collapsing Header | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        A tall header that shrinks to a bar as you scroll, then stays pinned. Think
        of a profile page with a big cover photo.

        Two features combine:
        1. A sticky header with a negative `top` scrolls up until only its bottom
           56px are visible, then sticks there.
        2. A scroll-driven animation shrinks the title. `animation-timeline:
           scroll()` runs a normal CSS animation by scroll position instead of
           time.

        Scroll-driven animations are new. Where a browser lacks them, the title
        keeps one size and the header still collapses.

        In Flutter: SliverAppBar with `pinned: true` and an `expandedHeight`.
      */

      .scroller {
        height: 70vh;
        overflow-y: auto;
      }

      /* 200px tall, but sticks once only its last 56px are visible:
         top = 56px - 200px. */
      .header {
        align-items: flex-end;
        height: 200px;
        justify-content: flex-start;
        padding: 16px;
        position: sticky;
        top: -144px;
      }

      /* Shrink the title over the first 144px of scrolling.
         Browsers without scroll-driven animations show a fixed size. */
      .header h3 {
        animation: shrink linear both;
        animation-range: 0 144px;
        animation-timeline: scroll();
        font-size: 1.25rem;
        transform-origin: left bottom;
      }

      @keyframes shrink {
        from {
          transform: scale(1.5);
        }
        to {
          transform: scale(1);
        }
      }

      .stack {
        padding: 16px;
      }
    </style>
  </head>

    <header>
      <a class="back" href="index.html" aria-label="All demos" title="All demos"
