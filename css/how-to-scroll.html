    <title>1. How to Scroll | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        How to make content scroll at all.

        In the browser, a page taller than the window scrolls by default. You do
        nothing. Any element scrolls too, once it has a fixed height and
        `overflow: auto` (see Nested Scrolling).

        In Flutter, nothing scrolls unless you wrap it in a scrollable widget,
        like ListView or SingleChildScrollView.
      */

      /* The page grows taller than the window, so the browser scrolls it. */
      main div {
        height: 200vh;
      }
    </style>
  </head>
