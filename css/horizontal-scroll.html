    <title>2. Horizontal Scroll | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        A row of cards that scrolls sideways.

        `overflow-x: auto` lets a box scroll horizontally when its content is wider
        than it. Here, a flex row of cards is wider than the screen.

        In Flutter: `scrollDirection: Axis.horizontal` on a ListView.
      */

      .row {
        display: flex;
        gap: 16px;
        height: 160px;
        overflow-x: auto;
        padding: 24px 0;
      }

      /* Keep each card's width instead of shrinking it to fit. */
      .row > div {
        flex: 0 0 160px;
      }
    </style>
  </head>
