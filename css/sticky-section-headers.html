<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>6. Sticky Section Headers | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        Section headers that stick to the top while their section is on screen,
        then get pushed away by the next one. Think of the letters in a contacts
        list.

        Every header is sticky. A sticky element never leaves its parent, so each
        header lets go when its <section> scrolls away. That's all it takes.

        In Flutter: a PinnedHeaderSliver inside a SliverMainAxisGroup per section.
        The group plays the role of the parent <section>.
      */

      .scroller {
        height: 70vh;
        overflow-y: auto;
      }

      section .stack {
        padding: 12px 0;
      }

      /* A sticky element never leaves its parent, so each header lets go
         when its section scrolls away. */
      section h3 {
        height: 48px;
        position: sticky;
        top: 0;
      }
    </style>
  </head>
  <body class="layout">
    <header>
      <a class="back" href="index.html" aria-label="All demos" title="All demos"
        ><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg
      ></a>
      <h1><span class="number">6</span><span class="title">Sticky Section Headers</span></h1>
    </header>
    <main>
      <p>position: sticky; (one per section)</p>
      <div class="scroller">
        <section>
          <h3 class="block highlight">Section A</h3>
          <div class="stack" data-fill="6" data-label="A"></div>
        </section>
        <section>
          <h3 class="block highlight">Section B</h3>
          <div class="stack" data-fill="6" data-label="B"></div>
        </section>
        <section>
          <h3 class="block highlight">Section C</h3>
          <div class="stack" data-fill="6" data-label="C"></div>
        </section>
        <section>
          <h3 class="block highlight">Section D</h3>
          <div class="stack" data-fill="6" data-label="D"></div>
        </section>
        <section>
          <h3 class="block highlight">Section E</h3>
          <div class="stack" data-fill="6" data-label="E"></div>
        </section>
      </div>
    </main>
