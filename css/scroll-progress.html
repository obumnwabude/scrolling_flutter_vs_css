    <title>14. Scroll Progress | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        A bar that fills up as you scroll, showing how far you've read.

        `animation-timeline: scroll()` ties a normal CSS animation to the scroll
        position of the nearest scrolling ancestor. At the top, the animation is at
        0%. At the bottom, it's at 100%. No JavaScript.

        In Flutter: a ScrollController and a ListenableBuilder that rebuilds a
        LinearProgressIndicator on every scroll.
      */

      .scroller {
        height: 70vh;
        overflow-y: auto;
      }

      /* Grows from 0 to full width as the scroller goes from top to bottom.
         Browsers without scroll-driven animations show no bar. */
      .progress {
        animation: grow linear both;
        animation-timeline: scroll();
        background-color: var(--highlight);
        height: 8px;
        position: sticky;
        top: 0;
        transform: scaleX(0);
        transform-origin: left;
      }

      @keyframes grow {
        to {
          transform: scaleX(1);
        }
      }

      .stack {
        padding: 24px 0;
      }
    </style>
  </head>
