    <title>12. Custom Scrollbar | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        A scrollbar with your own colors, which is always visible.

        `scrollbar-color` takes the thumb color, then the track color.
        `scrollbar-width` takes `auto`, `thin`, or `none`. That's all standard CSS
        offers: no exact thickness, no rounded corners. The older
        `::-webkit-scrollbar` pseudo-elements offer both, in Chrome and Safari.

        In Flutter: RawScrollbar (or Scrollbar with a ScrollbarTheme), with any
        color, thickness, and radius.
      */

      .scroller {
        display: flex;
        height: 70vh;
        overflow-y: scroll; /* Always show the scrollbar. */
        padding-right: 16px;
        scrollbar-color: var(--highlight) #b3e5fc; /* thumb, then track */
        scrollbar-width: auto; /* or thin, or none */
      }

      /* Older Safari ignores scrollbar-color, and uses these instead. */
      .scroller::-webkit-scrollbar {
        width: 12px;
      }

      .scroller::-webkit-scrollbar-track {
        background: #b3e5fc;
      }

      .scroller::-webkit-scrollbar-thumb {
        background: var(--highlight);
        border-radius: 6px;
      }
    </style>
  </head>
