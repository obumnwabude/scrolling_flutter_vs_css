    <title>10. Scroll Snap | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        Scrolling that always comes to rest on a whole card, like a carousel.

        `scroll-snap-type: x mandatory` on the container makes it snap
        horizontally, every time. `scroll-snap-align: center` on each card says
        which part of the card to snap to. Each card is 80% wide, so its neighbours
        peek in from the sides.

        In Flutter: a PageView with `PageController(viewportFraction: 0.8)`.
      */

      .carousel {
        display: flex;
        height: 240px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
      }

      /* Each card is 80% wide, so its neighbours peek in from the sides. */
      .carousel > div {
        border-inline: 8px solid white;
        flex: 0 0 80%;
        scroll-snap-align: center;
      }

      /* Let the first and last cards reach the center too. */
      .carousel::before,
      .carousel::after {
        content: '';
        flex: 0 0 10%;
      }
    </style>
  </head>
