    <title>3. Prevent Scroll | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        Content taller than the screen, which the user can't scroll. You might do
        this behind a modal or a menu.

        `overflow: hidden` clips the extra content and turns off scrolling for the
        user. Code can still scroll it, with `element.scrollTo()`.

        In Flutter: NeverScrollableScrollPhysics on a scrollable. Just not using a
        scrollable shows Flutter's yellow and black overflow stripes instead.
      */

      /* The page scrolls on <html>, so that's where scrolling is turned off.
         Setting it on <body> too covers older browsers. */
      html,
      body {
        overflow: hidden;
      }

      /* The same tall box as in How to Scroll, now out of reach. */
      main div {
        height: 200vh;
      }
    </style>
  </head>
