<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7. Occupy Free Space or Scroll | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        A layout that stretches one child to fill the free space when the content
        is short, and scrolls when the content is taller than the container. Think
        of a form with its button at the bottom of a tall screen.

        A flex column with a fixed height knows how much free space it has.
        `flex: 1` gives it to the filler, and `overflow: auto` lets the column
        scroll once the items no longer fit.

        In Flutter: SliverFillRemaining(hasScrollBody: false) around a Column with
        an Expanded child.

        Click "Add item" until the items no longer fit, and the container scrolls.
      */

      .scroller {
        align-items: stretch;
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 70vh;
        justify-content: flex-start;
        overflow-y: auto;
      }

      /* Flex items shrink by default to fit their container. Without this,
         the items would squash instead of overflowing, and nothing would
         ever scroll. */
      .scroller > .child {
        flex-shrink: 0;
        height: 64px;
      }

      /* At least 120px tall, and grows to fill the free space. */
      .filler {
        flex: 1 0 120px;
      }
    </style>
  </head>
  <body class="layout">
    <header>
      <a class="back" href="index.html" aria-label="All demos" title="All demos"
        ><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg
      ></a>
      <h1><span class="number">7</span><span class="title">Occupy Free Space or Scroll</span></h1>
    </header>
    <main>
      <p>display: flex; flex: 1; overflow: auto;</p>
      <button id="add">Add item</button>
      <br /><br />
      <div class="block container padded scroller">
        <div class="block child"></div>
        <div class="block highlight filler">Filler</div>
        <div class="block child"></div>
      </div>
    </main>
    <!-- Floating buttons to the previous demo, all demos, and the next demo. -->
    <nav class="demo-nav" aria-label="Demos">
      <a
        href="sticky-section-headers.html"
        aria-label="Previous: Sticky Section Headers"
        title="Previous: Sticky Section Headers"
        ><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg
      ></a>
      <a href="index.html" aria-label="All demos" title="All demos"
        ><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"
          /></svg
      ></a>
      <a href="collapsing-header.html" aria-label="Next: Collapsing Header" title="Next: Collapsing Header"
        ><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /></svg
      ></a>
    </nav>
    <script>
      // Add items until they no longer fit, and the container scrolls.
      document.querySelector('#add').addEventListener('click', () => {
        const item = document.createElement('div');
        item.className = 'block child';
        document.querySelector('.filler').before(item);
      });
    </script>
  </body>
</html>
