    <meta charset="UTF-8" />

    <title>11. Overscroll Behavior | Scrolling Insights</title>
    <link rel="stylesheet" href="all.css" />
    <style>
      /*
        What happens when you keep scrolling past the end of a box.

        With `overscroll-behavior: auto` (the default), the page behind takes over
        once a box reaches its end. That's scroll chaining. With `contain`, it
        stops at the edge of the box, with no bounce and no pull-to-refresh.

        In Flutter, scroll physics decide how the edge feels: BouncingScrollPhysics
        springs back like iOS, ClampingScrollPhysics stops like Android. Flutter
        doesn't chain finger drags between nested scrollables at all.
      */

      .inner {
        height: 240px;
        overflow-y: auto;
      }

      /* When this list hits its end, the page does not take over,
         and the browser does not bounce or pull to refresh. */
      .contain {
        overscroll-behavior: contain;
      }

      .tail {
        height: 100vh;
        margin-top: 2rem;
      }
    </style>
  </head>

    </header>
    <main>
      <p>overscroll-behavior: auto | contain;</p>
      <h2>auto (scrolling carries on to the page)</h2>
      <div class="block container padded stack inner" data-fill="10"></div>

      <h2>contain (scrolling stops at the edge)</h2>
      <div class="block container padded stack inner contain" data-fill="10"></div>

      <div class="block container tail"></div>
    </main>
